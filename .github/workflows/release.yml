name: Release

on:
  push:
    tags: ["v*"]
  # manual runs build the archives as workflow artifacts without releasing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: System libraries for eframe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo build --release --locked --target ${{ matrix.target }} -p rootkin
      - name: Package
        shell: bash
        run: |
          name=rootkin-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/rootkin${{ matrix.ext }} README.md UNLICENSE LICENSE-MIT "$name"/
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rootkin-*.*
          # tags like v0.2.0-beta.1 are test builds
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: rootkin-${{ matrix.target }}
          path: rootkin-*.*
